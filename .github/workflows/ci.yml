name: CI
on: [pull_request, push]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24.21.0 }
      - run: |
          sh -n scripts/*.sh
          for file in scripts/*.mjs; do node --check "$file"; done
          python3 -c 'import ast, pathlib; ast.parse(pathlib.Path("scripts/saleor-e2e.py").read_text())'
          test ! -e scripts/verify-e2e-saleor.mjs
          test ! -e scripts/install-e2e-payment-webhook.mjs
          test ! -e scripts/ensure-e2e-saleor.mjs
          test "$(grep '^for name in .*; do$' scripts/run-e2e-storefront.sh)" = \
            'for name in MONTONIO_ACCESS_KEY MONTONIO_SECRET_KEY COMMERCE_EVENT_HMAC_KEY; do'
          # The product editor is deployed separately and must not block storefront startup.
          test "$(grep '^  for name in SALEOR_COMMERCE_APP_TOKEN .*; do$' aws/cloud_init/terrahorse-reconcile.sh.tftpl)" = \
            '  for name in SALEOR_COMMERCE_APP_TOKEN COMMERCE_EVENT_HMAC_KEY MONTONIO_ACCESS_KEY MONTONIO_SECRET_KEY CLOUDFLARED_TUNNEL_TOKEN POSTGRES_PASSWORD SECRET_KEY EMAIL_URL; do'
          test "$(grep '^    for name in OPENAI_API_KEY .*; do$' aws/cloud_init/terrahorse-reconcile-product-editor.sh.tftpl)" = \
            '    for name in OPENAI_API_KEY EDITOR_GITHUB_TOKEN; do'
          test "$(grep -c 'aws ssm get-parameters' aws/cloud_init/terrahorse-reconcile-product-editor.sh.tftpl)" = 1
          test "$(grep '^    --names .*SALEOR_EDITOR_APP_ID.*SALEOR_EDITOR_APP_TOKEN' aws/cloud_init/terrahorse-reconcile-product-editor.sh.tftpl)" = \
            '    --names "$${parameter_prefix}/SALEOR_EDITOR_APP_ID" "$${parameter_prefix}/SALEOR_EDITOR_APP_TOKEN" \'
          ! grep -Eq 'OPENAI_API_KEY|EDITOR_GITHUB_TOKEN|SALEOR_EDITOR_APP_(ID|TOKEN)|product-editor' \
            aws/cloud_init/terrahorse-reconcile.sh.tftpl
          ! git grep -nEi 'shared[- ]saleor|SALEOR_E2E_ADMIN_TOKEN' -- ':!.github/workflows/ci.yml'
          APP_VERSION=test E2E_INFRA_ROOT=/tmp E2E_RUN_STATE_DIR=/tmp E2E_STOREFRONT_WORKTREE=/tmp \
            E2E_TUNNEL_CONFIG_FILE=/tmp/config E2E_TUNNEL_CREDENTIALS_FILE=/tmp/credentials \
            SALEOR_DATABASE_PASSWORD=test SALEOR_SECRET_KEY=test \
            SALEOR_PAYMENT_WEBHOOK_SECRET=01234567890123456789012345678901 \
            docker compose -f compose.e2e.yml config --quiet
